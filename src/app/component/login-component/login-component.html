<div class="login-page">
  <div class="panel login-card">
    <div class="login-head">
      <app-leviathan-cross />
      <span class="eyebrow">Porta clausa</span>
      <h1 class="login-title">Sign in</h1>
      <p class="muted">Private dashboards stay sealed until you do.</p>
    </div>

    <form class="stack" (ngSubmit)="login()" autocomplete="on">
      <label class="field">
        <span class="label">Username</span>
        <span class="input-wrap">
          <i class="bi bi-person"></i>
          <input
            class="input"
            name="username"
            type="text"
            autocomplete="username"
            placeholder="your name"
            required
            [(ngModel)]="username" />
        </span>
      </label>

      <label class="field">
        <span class="label">Password</span>
        <span class="input-wrap">
          <i class="bi bi-key"></i>
          <input
            class="input input-password"
            name="password"
            autocomplete="current-password"
            placeholder="••••••••"
            required
            [type]="showPassword() ? 'text' : 'password'"
            [(ngModel)]="password" />
          <button
            class="reveal"
            type="button"
            (click)="showPassword.set(!showPassword())"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
            <i class="bi" [class]="showPassword() ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </span>
      </label>

      @if (error()) {
        <div class="alert" role="alert">
          <i class="bi bi-exclamation-circle"></i>
          <span>{{ error() }}</span>
        </div>
      }

      <button class="btn btn-primary btn-block" type="submit" [disabled]="loading() || !username || !password">
        @if (loading()) {
          <span class="spinner"></span>
          Signing in…
        } @else {
          Sign in
        }
      </button>
    </form>
  </div>
</div>
