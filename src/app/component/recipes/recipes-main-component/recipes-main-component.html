<div class="page">
  <header class="page-header">
    <span class="eyebrow">Ars coquinaria</span>
    <h1 class="title">Recipes</h1>
    <p class="subtitle">Tried, tweaked and approved.</p>
  </header>

  @for (category of categories; track category.id) {
    <section class="category">
      <h2 class="section-title">{{ category.name }}</h2>

      <div class="tiles">
        @for (recipe of category.recipes; track recipe.id) {
          <a class="tile" [routerLink]="['/recipes', category.id, recipe.id]">
            <div class="tile-fallback"></div>
            <img
              class="tile-img"
              [src]="'assets/' + recipe.id + '.jpg'"
              [alt]="recipe.name"
              loading="lazy"
              (error)="$any($event.target).remove()" />
            <span class="tile-caption">{{ recipe.name }}</span>
          </a>
        }
      </div>
    </section>
  }
</div>
