<div class="page">
  <a class="back-link" routerLink="/panopsys"><i class="bi bi-arrow-left"></i> PanOpSys</a>

  <header class="page-header">
    <span class="eyebrow">Spiritus mundi</span>
    <h1 class="title">Atmosphäre</h1>
    <div class="status-line">
      @if (failed()) {
        <span class="status-error"><i class="bi bi-exclamation-triangle"></i> Sensor nicht erreichbar</span>
      } @else {
        <span class="flame"></span>
        <span>Letzter Messwert · {{ timeInfo() }}</span>
      }
    </div>
  </header>

  <div class="stat-row atmo-stats">
    <div class="stat stat-lg">
      <span class="stat-label"><i class="bi bi-thermometer-half"></i> Temperatur</span>
      <span class="stat-value">{{ atmo()?.temp ?? '–' }}<span class="stat-unit">°C</span></span>
    </div>
    <div class="stat stat-lg">
      <span class="stat-label"><i class="bi bi-droplet-half"></i> Luftfeuchtigkeit</span>
      <span class="stat-value">{{ atmo()?.humidity ?? '–' }}<span class="stat-unit">%</span></span>
    </div>
    <div class="stat stat-lg">
      <span class="stat-label"><i class="bi bi-speedometer2"></i> Luftdruck</span>
      <span class="stat-value">{{ atmo()?.pressure ?? '–' }}<span class="stat-unit">hPa</span></span>
    </div>
  </div>

  <app-atmo-chart></app-atmo-chart>
</div>
