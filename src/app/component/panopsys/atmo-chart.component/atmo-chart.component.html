<section class="panel">
  <div class="chart-head">
    <h2 class="panel-title"><i class="bi bi-graph-up"></i> Verlauf</h2>

    <div class="chart-controls">
      @for (s of series; track s.key) {
        <button
          type="button"
          class="chip"
          [class.is-active]="visible()[s.key]"
          [style.--dot]="'var(' + s.colorVar + ')'"
          [attr.aria-pressed]="visible()[s.key]"
          (click)="toggle(s.key)">
          <span class="chip-dot"></span>{{ s.label }}
        </button>
      }

      <select class="select" aria-label="Anzahl Messwerte" (change)="onLimitChange($event)">
        @for (l of limits; track l) {
          <option [value]="l" [selected]="l === limit()">{{ l.toLocaleString('de-AT') }} Werte</option>
        }
      </select>
    </div>
  </div>

  @if (failed()) {
    <div class="alert chart-alert"><i class="bi bi-exclamation-circle"></i> Verlaufsdaten konnten nicht geladen werden.</div>
  }

  <div class="chart-wrap">
    <canvas #canvas></canvas>
  </div>
</section>
